<style>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const API='https://discord.com/api/v10';
const CDN='https://cdn.discordapp.com';
const isUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test(u||'');
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const P={ADMIN:8n,KICK:2n,BAN:4n,VIEW:1n<<10n,SEND:1n<<11n,MANAGE_MSG:1n<<13n,ATTACH:1n<<15n,HIST:1n<<16n,REACT:1n<<6n,MOD:1n<<40n,NICK:1n<<27n,MANAGE_NICK:1n<<27n};
const ALLP=(1n<<64n)-1n;

const ST={tok:'',me:null,guilds:new Map(),chans:new Map(),msgs:new Map(),dms:new Map(),pres:new Map(),unread:new Map(),ment:new Map(),typing:new Map(),g:null,c:null,home:true,ready:false,limited:false,status:LS('bc_status',{s:'online',t:0,x:''}),set:LS('bc_set',{theme:'dark',font:16,compact:false})};
const GW={ws:null,seq:null,sid:null,url:null,hb:null,ack:true,stop:false,tries:0,intents:0};
const FULL=1|2|4|8|256|512|1024|4096|32768;
const BASIC=1|4|8|512|1024|4096;

const apiBase=()=>((ST.set.api||'').trim().replace(/\/+$/,''))||API;
async function api(method,path,body,opts={}){
  for(let a=0;a<4;a++){
    const h={Authorization:'Bot '+ST.tok};
    let b;
    if(body instanceof FormData)b=body;
    else if(body!==undefined){h['Content-Type']='application/json';b=JSON.stringify(body)}
    if(opts.reason)h['X-Audit-Log-Reason']=encodeURIComponent(opts.reason);
    let r;
    try{r=await fetch(apiBase()+path,{method,headers:h,body:b})}catch(e){
      if(a===0&&!(b instanceof FormData)){await sleep(900);continue}
      throw new Error('Network error')}
    if(r.status===429){const j=await r.json().catch(()=>({}));await sleep((j.retry_after||1)*1000+100);continue}
    if(r.status===204)return null;
    const t=await r.text();
    let j=null;try{j=JSON.parse(t)}catch(e){}
    if(!r.ok)throw Object.assign(new Error((j&&j.message)||('HTTP '+r.status)),{status:r.status,code:j&&j.code});
    return j}
  throw new Error('Rate limited')}

const snow=id=>BigInt(id);
const idTime=id=>Number((snow(id)>>22n)+1420070400000n);
const defAvatar=u=>CDN+'/embed/avatars/'+(u.discriminator&&u.discriminator!=='0'?Number(u.discriminator)%5:Number((snow(u.id)>>22n)%6n))+'.png';
const avatar=(u,sz=64)=>u.avatar?CDN+'/avatars/'+u.id+'/'+u.avatar+(u.avatar.startsWith('a_')?'.gif':'.png')+'?size='+sz:defAvatar(u);
const gIcon=(g,sz=64)=>g.icon?CDN+'/icons/'+g.id+'/'+g.icon+(g.icon.startsWith('a_')?'.gif':'.png')+'?size='+sz:'';
const uname=u=>u?(u.global_name||u.username||'Unknown'):'Unknown';
const hexCol=n=>n?'#'+n.toString(16).padStart(6,'0'):'';

function guildOf(id){return ST.guilds.get(id)}
function memberOf(g,uid){return g&&g.members?g.members.get(uid):null}
function dispName(g,u,m){m=m||memberOf(g,u.id);return(m&&m.nick)||uname(u)}
function roleList(g,m){if(!g||!m)return[];return(m.roles||[]).map(r=>g.roles.get(r)).filter(Boolean).sort((a,b)=>b.position-a.position)}
function topRole(g,m){return roleList(g,m)[0]}
function colorOf(g,m){const r=roleList(g,m).find(x=>x.color);return r?hexCol(r.color):''}
function myPos(g){if(g.owner_id===ST.me.id)return 1e9;const t=topRole(g,g.me);return t?t.position:0}
function basePerms(g){
  if(g.owner_id===ST.me.id)return ALLP;
  const ev=g.roles.get(g.id);
  let p=BigInt((ev&&ev.permissions)||0);
  for(const r of roleList(g,g.me))p|=BigInt(r.permissions||0);
  return p&P.ADMIN?ALLP:p}
function chanPerms(g,c){
  let p=basePerms(g);
  if(p===ALLP)return p;
  const ov=c.permission_overwrites||[];
  const e=ov.find(o=>o.id===g.id);
  if(e){p&=~BigInt(e.deny);p|=BigInt(e.allow)}
  let al=0n,dn=0n;
  const mine=(g.me&&g.me.roles)||[];
  ov.filter(o=>o.type===0&&mine.includes(o.id)).forEach(o=>{al|=BigInt(o.allow);dn|=BigInt(o.deny)});
  p&=~dn;p|=al;
  const m=ov.find(o=>o.type===1&&o.id===ST.me.id);
  if(m){p&=~BigInt(m.deny);p|=BigInt(m.allow)}
  return p}
const has=(p,f)=>(p&f)===f;
function canMod(g,tm,flag){
  if(!g||!g.me)return false;
  if(!has(basePerms(g),flag)&&!has(basePerms(g),P.ADMIN))return false;
  if(tm&&tm.user&&tm.user.id===g.owner_id)return false;
  if(tm&&tm.user&&tm.user.id===ST.me.id)return false;
  if(tm){const t=topRole(g,tm);if(t&&t.position>=myPos(g))return false}
  return true}

const CT={TEXT:0,DM:1,VOICE:2,CAT:4,NEWS:5,STAGE:13,FORUM:15};
const textual=c=>c.type===CT.TEXT||c.type===CT.NEWS;
function guildChannels(g){
  return[...ST.chans.values()].filter(c=>c.guild_id===g.id)}
function visibleChans(g){
  return guildChannels(g).filter(c=>c.type===CT.CAT?true:has(chanPerms(g,c),P.VIEW))}

function setGuild(d){
  const old=ST.guilds.get(d.id)||{};
  const g={...old,...d,unavailable:false};
  g.roles=new Map((d.roles||[...(old.roles?old.roles.values():[])]).map(r=>[r.id,r]));
  g.members=old.members||new Map();
  (d.members||[]).forEach(m=>g.members.set(m.user.id,m));
  g.emojis=d.emojis||old.emojis||[];
  g.me=old.me||g.members.get(ST.me&&ST.me.id)||null;
  ST.guilds.set(g.id,g);
  (d.channels||[]).forEach(c=>ST.chans.set(c.id,{...c,guild_id:g.id}));
  (d.presences||[]).forEach(p=>ST.pres.set(p.user.id,p.status));
  return g}

function connect(){
  if(GW.ws){try{GW.ws.onclose=null;GW.ws.close()}catch(e){}}
  setConn('Connecting…');
  const ws=new WebSocket((GW.sid&&GW.url?GW.url:'wss://gateway.discord.gg')+'/?v=10&encoding=json');
  GW.ws=ws;
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.s!=null)GW.seq=m.s;
    if(m.op===10){
      clearInterval(GW.hb);GW.ack=true;
      const iv=m.d.heartbeat_interval;
      setTimeout(()=>beat(),iv*Math.random());
      GW.hb=setInterval(beat,iv);
      if(GW.sid)ws.send(JSON.stringify({op:6,d:{token:ST.tok,session_id:GW.sid,seq:GW.seq}}));
      else identify()}
    else if(m.op===11)GW.ack=true;
    else if(m.op===1)beat();
    else if(m.op===7)ws.close(4000);
    else if(m.op===9){GW.sid=null;setTimeout(identify,1000+Math.random()*3000)}
    else if(m.op===0)dispatch(m.t,m.d)};
  ws.onclose=e=>{
    clearInterval(GW.hb);
    ST.ready=false;
    if(GW.stop)return;
    if(e.code===4004){authFail();return}
    if(e.code===4014||e.code===4013){
      if(GW.intents!==BASIC){GW.intents=BASIC;ST.limited=true;toast('Privileged intents are off for this bot. Live chat works, but member list, presence and message content are limited.');GW.sid=null;setTimeout(connect,500);return}
      authFail('Invalid intents.');return}
    GW.tries++;
    setConn('Reconnecting…');
    setTimeout(connect,Math.min(1000*GW.tries,8000))};
  ws.onerror=()=>{}}
function beat(){
  if(!GW.ws||GW.ws.readyState!==1)return;
  if(!GW.ack){GW.ws.close(4000);return}
  GW.ack=false;GW.ws.send(JSON.stringify({op:1,d:GW.seq}))}
function presencePayload(){
  const s=ST.status,acts=[];
  if(s.x){acts.push(s.t===4?{name:'Custom Status',type:4,state:s.x}:{name:s.x,type:s.t})}
  return{since:null,activities:acts,status:s.s,afk:false}}
function identify(){
  if(!GW.ws||GW.ws.readyState!==1)return;
  GW.ws.send(JSON.stringify({op:2,d:{token:ST.tok,intents:GW.intents,properties:{os:'android',browser:'botcord',device:'botcord'},presence:presencePayload()}}))}
function sendPresence(){
  if(GW.ws&&GW.ws.readyState===1)GW.ws.send(JSON.stringify({op:3,d:presencePayload()}))}

function chanMsgs(id){return ST.msgs.get(id)}
function dispatch(t,d){
  if(t==='READY'){
    GW.sid=d.session_id;GW.url=d.resume_gateway_url;GW.tries=0;
    ST.me=d.user;ST.ready=true;
    d.guilds.forEach(g=>{if(!ST.guilds.has(g.id))ST.guilds.set(g.id,{id:g.id,unavailable:true,name:'Loading',roles:new Map(),members:new Map(),emojis:[]})});
    setConn('');onReady();return}
  if(t==='RESUMED'){setConn('');return}
  if(t==='GUILD_CREATE'){const g=setGuild(d);renderRail();if(ST.g===g.id)renderChannels();loadSelf(g);return}
  if(t==='GUILD_UPDATE'){const g=ST.guilds.get(d.id);if(g){Object.assign(g,{name:d.name,icon:d.icon,owner_id:d.owner_id});(d.roles||[]).forEach(r=>g.roles.set(r.id,r));renderRail();if(ST.g===g.id)renderChannels()}return}
  if(t==='GUILD_DELETE'){
    if(d.unavailable)return;
    ST.guilds.delete(d.id);
    [...ST.chans.values()].filter(c=>c.guild_id===d.id).forEach(c=>ST.chans.delete(c.id));
    if(ST.g===d.id)goHome();
    renderRail();return}
  if(t==='CHANNEL_CREATE'||t==='CHANNEL_UPDATE'){
    if(d.guild_id){ST.chans.set(d.id,d);if(ST.g===d.guild_id)renderChannels();if(ST.c===d.id)renderHeader()}
    else if(d.type===CT.DM){ST.dms.set(d.id,d);saveDMs();if(ST.home)renderChannels()}
    return}
  if(t==='CHANNEL_DELETE'){
    ST.chans.delete(d.id);ST.dms.delete(d.id);
    if(ST.c===d.id){ST.c=null;renderChat()}
    if(ST.g===d.guild_id||ST.home)renderChannels();return}
  if(t==='MESSAGE_CREATE'){onMessage(d);return}
  if(t==='MESSAGE_UPDATE'){
    const l=ST.msgs.get(d.channel_id);if(!l)return;
    const m=l.find(x=>x.id===d.id);if(!m)return;
    Object.assign(m,d);if(ST.c===d.channel_id)redrawMsg(m.id);return}
  if(t==='MESSAGE_DELETE'||t==='MESSAGE_DELETE_BULK'){
    const ids=t==='MESSAGE_DELETE'?[d.id]:d.ids;
    const l=ST.msgs.get(d.channel_id);if(!l)return;
    ST.msgs.set(d.channel_id,l.filter(x=>!ids.includes(x.id)));
    if(ST.c===d.channel_id)ids.forEach(i=>dropMsg(i));return}
  if(t==='MESSAGE_REACTION_ADD'||t==='MESSAGE_REACTION_REMOVE'||t==='MESSAGE_REACTION_REMOVE_ALL'||t==='MESSAGE_REACTION_REMOVE_EMOJI'){onReaction(t,d);return}
  if(t==='GUILD_MEMBER_ADD'||t==='GUILD_MEMBER_UPDATE'){
    const g=ST.guilds.get(d.guild_id);if(!g)return;
    const o=g.members.get(d.user.id)||{};
    const m={...o,...d};g.members.set(d.user.id,m);
    if(d.user.id===ST.me.id)g.me=m;
    if(ST.g===g.id)renderMembers();return}
  if(t==='GUILD_MEMBER_REMOVE'){const g=ST.guilds.get(d.guild_id);if(g){g.members.delete(d.user.id);if(ST.g===g.id)renderMembers()}return}
  if(t==='PRESENCE_UPDATE'){ST.pres.set(d.user.id,d.status);if(ST.g===d.guild_id)renderMembers();return}
  if(t==='GUILD_ROLE_CREATE'||t==='GUILD_ROLE_UPDATE'){const g=ST.guilds.get(d.guild_id);if(g){g.roles.set(d.role.id,d.role);if(ST.g===g.id){renderChannels();renderMembers()}}return}
  if(t==='GUILD_ROLE_DELETE'){const g=ST.guilds.get(d.guild_id);if(g){g.roles.delete(d.role_id);if(ST.g===g.id)renderMembers()}return}
  if(t==='TYPING_START'){
    if(d.user_id===ST.me.id)return;
    const k=d.channel_id;
    const m=ST.typing.get(k)||new Map();
    const g=guildOf(d.guild_id);
    const mem=d.member||memberOf(g,d.user_id);
    m.set(d.user_id,{t:Date.now()+9000,name:mem&&mem.user?dispName(g,mem.user,mem):'Someone'});
    ST.typing.set(k,m);drawTyping();return}
  if(t==='USER_UPDATE'){ST.me=d;renderUserBar()}}

function onMessage(m){
  const l=ST.msgs.get(m.channel_id);
  if(l&&!l.some(x=>x.id===m.id)){l.push(m);if(l.length>300)l.splice(0,l.length-300)}
  const tm=ST.typing.get(m.channel_id);if(tm)tm.delete(m.author.id);
  if(!m.guild_id&&!ST.dms.has(m.channel_id)){
    api('GET','/channels/'+m.channel_id).then(c=>{ST.dms.set(c.id,c);saveDMs();if(ST.home)renderChannels()}).catch(()=>{})}
  if(ST.c===m.channel_id){
    if(l)appendMsg(m);
    if(m.author.id!==ST.me.id&&document.hidden)bump(m);
    return}
  if(m.author.id===ST.me.id)return;
  ST.unread.set(m.channel_id,(ST.unread.get(m.channel_id)||0)+1);
  const mine=(m.mentions||[]).some(u=>u.id===ST.me.id)||m.mention_everyone||!m.guild_id;
  if(mine)ST.ment.set(m.channel_id,(ST.ment.get(m.channel_id)||0)+1);
  renderRail();if(ST.home||ST.g===m.guild_id)renderChannels()}

function onReaction(t,d){
  const l=ST.msgs.get(d.channel_id);if(!l)return;
  const m=l.find(x=>x.id===d.message_id);if(!m)return;
  const key=e=>e.id?e.name+':'+e.id:e.name;
  m.reactions=m.reactions||[];
  if(t==='MESSAGE_REACTION_ADD'){
    const r=m.reactions.find(x=>key(x.emoji)===key(d.emoji));
    if(r){r.count++;if(d.user_id===ST.me.id)r.me=true}else m.reactions.push({emoji:d.emoji,count:1,me:d.user_id===ST.me.id})}
  else if(t==='MESSAGE_REACTION_REMOVE'){
    const r=m.reactions.find(x=>key(x.emoji)===key(d.emoji));
    if(r){r.count--;if(d.user_id===ST.me.id)r.me=false;if(r.count<=0)m.reactions=m.reactions.filter(x=>x!==r)}}
  else if(t==='MESSAGE_REACTION_REMOVE_ALL')m.reactions=[];
  else m.reactions=m.reactions.filter(x=>key(x.emoji)!==key(d.emoji));
  if(ST.c===d.channel_id)redrawMsg(m.id)}

function saveDMs(){LSset('bc_dm_'+(ST.me?ST.me.id:''),[...ST.dms.keys()].slice(-40))}
async function loadDMs(){
  const ids=LS('bc_dm_'+ST.me.id,[]);
  for(const id of ids){
    if(ST.dms.has(id))continue;
    try{const c=await api('GET','/channels/'+id);if(c&&c.type===CT.DM)ST.dms.set(c.id,c)}catch(e){}}
  if(ST.home)renderChannels()}
async function loadSelf(g){
  if(g.me||!ST.me)return;
  try{g.me=await api('GET','/guilds/'+g.id+'/members/'+ST.me.id).catch(()=>api('GET','/guilds/'+g.id+'/members/@me'));
    g.members.set(ST.me.id,g.me);if(ST.g===g.id){renderChannels();renderChat()}}catch(e){}}
async function loadMembers(g){
  if(g.loadedMem||ST.limited&&false)return;
  g.loadedMem=true;
  try{
    const l=await api('GET','/guilds/'+g.id+'/members?limit=1000');
    l.forEach(m=>g.members.set(m.user.id,m));
    if(ST.g===g.id)renderMembers()}catch(e){g.memErr=e.message;if(ST.g===g.id)renderMembers()}}
async function loadHistory(cid,before){
  const q='?limit=50'+(before?'&before='+before:'');
  const l=await api('GET','/channels/'+cid+'/messages'+q);
  return l.reverse()}

function fmtTime(ts){
  const d=new Date(ts),n=new Date();
  const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const dd=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(dd===0)return'Today at '+t;
  if(dd===1)return'Yesterday at '+t;
  return d.toLocaleDateString()+' '+t}

function md(src,g,mentions){
  let s=String(src||'');
  const K=[];
  const hold=h=>{K.push(h);return'\u0000'+(K.length-1)+'\u0000'};
  s=s.replace(/```(?:[a-z0-9+#.-]*\n)?([\s\S]*?)```/gi,(m,c)=>hold('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>'));
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>hold('<code class="ci">'+esc(c)+'</code>'));
  s=esc(s);
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>hold('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+'</a>'));
  s=s.replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)\]'"])/g,u=>hold('<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'));
  s=s.replace(/&lt;@!?(\d+)&gt;/g,(m,id)=>{
    const u=(mentions||[]).find(x=>x.id===id);
    const mem=memberOf(g,id);
    const name=mem&&mem.nick?mem.nick:u?uname(u):mem&&mem.user?uname(mem.user):'user';
    return hold('<span class="mt">@'+esc(name)+'</span>')});
  s=s.replace(/&lt;@&amp;(\d+)&gt;/g,(m,id)=>{
    const r=g&&g.roles.get(id);
    const c=r&&r.color?hexCol(r.color):'';
    return hold('<span class="mt"'+(c?' style="color:'+c+';background:'+c+'26"':'')+'>@'+esc(r?r.name:'role')+'</span>')});
  s=s.replace(/&lt;#(\d+)&gt;/g,(m,id)=>{const c=ST.chans.get(id);return hold('<span class="mt">#'+esc(c?c.name:'channel')+'</span>')});
  s=s.replace(/&lt;(a?):(\w+):(\d+)&gt;/g,(m,a,n,id)=>hold('<img class="ce" alt=":'+n+':" src="'+emojiUrl(id,a)+'">'));
  s=s.replace(/&lt;t:(\d+)(?::([tTdDfFR]))?&gt;/g,(m,t,f)=>{
    const d=new Date(+t*1000);
    let x;
    if(f==='t')x=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    else if(f==='T')x=d.toLocaleTimeString();
    else if(f==='d')x=d.toLocaleDateString();
    else if(f==='D')x=d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    else if(f==='F')x=d.toLocaleString(undefined,{dateStyle:'full',timeStyle:'short'});
    else if(f==='R'){const df=Math.round((d-Date.now())/1000),a=Math.abs(df);const u=a<60?[a,'second']:a<3600?[Math.round(a/60),'minute']:a<86400?[Math.round(a/3600),'hour']:[Math.round(a/86400),'day'];x=df<0?u[0]+' '+u[1]+(u[0]===1?'':'s')+' ago':'in '+u[0]+' '+u[1]+(u[0]===1?'':'s')}
    else x=d.toLocaleString(undefined,{dateStyle:'long',timeStyle:'short'});
    return hold('<span class="mt">'+esc(x)+'</span>')});
  s=s.replace(/@(everyone|here)\b/g,(m,w)=>hold('<span class="mt">@'+w+'</span>'));
  s=s.replace(/\|\|([\s\S]+?)\|\|/g,'<span class="sp">$1</span>');
  s=s.replace(/\*\*\*([^*\n]+?)\*\*\*/g,'<b><i>$1</i></b>');
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/__([^_\n]+?)__/g,'<u>$1</u>');
  s=s.replace(/(^|[^\w*])\*([^*\n]+?)\*(?!\w)/g,'$1<i>$2</i>');
  s=s.replace(/(^|[^\w_])_([^_\n]+?)_(?!\w)/g,'$1<i>$2</i>');
  s=s.replace(/~~([^~\n]+?)~~/g,'<s>$1</s>');
  const lines=s.split('\n');
  const out=[];
  let q=[];
  const flush=()=>{if(q.length){out.push('<blockquote>'+q.join('<br>')+'</blockquote>');q=[]}};
  for(const l of lines){
    if(/^&gt;\s?/.test(l)){q.push(l.replace(/^&gt;\s?/,''));continue}
    flush();
    const h=l.match(/^(#{1,3})\s+(.+)$/);
    if(h)out.push('<div class="h'+h[1].length+'">'+h[2]+'</div>');
    else if(/^[-*]\s+/.test(l))out.push('<div class="li">• '+l.replace(/^[-*]\s+/,'')+'</div>');
    else out.push(l+'<br>')}
  flush();
  s=out.join('').replace(/(<br>)+$/,'').replace(/<\/(div|blockquote)><br>/g,'</$1>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>K[+i])}

function embedHtml(e,g,mentions){
  if(e.type==='image'&&e.thumbnail&&isUrl(e.thumbnail.url))return'<img class="att" src="'+esc(e.thumbnail.url)+'" loading="lazy" data-zoom="1">';
  if(e.type==='gifv'&&e.thumbnail&&isUrl(e.thumbnail.url))return'<img class="att" src="'+esc(e.thumbnail.url)+'" loading="lazy" data-zoom="1">';
  const col=e.color!=null?hexCol(e.color):'';
  let h='<div class="em" style="border-left-color:'+(col||'var(--bd)')+'"><div class="eb"><div class="ei">';
  if(e.provider&&e.provider.name&&e.type!=='rich')h+='<div class="ep">'+esc(e.provider.name)+'</div>';
  if(e.author){h+='<div class="ea">'+(isUrl(e.author.icon_url)?'<img src="'+esc(e.author.icon_url)+'">':'')+(e.author.url&&isUrl(e.author.url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(e.author.url)+'">'+esc(e.author.name)+'</a>':esc(e.author.name))+'</div>'}
  if(e.title)h+='<div class="et">'+(e.url&&isUrl(e.url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(e.url)+'">'+esc(e.title)+'</a>':esc(e.title))+'</div>';
  if(e.description)h+='<div class="ed">'+md(e.description,g,mentions)+'</div>';
  if(e.fields&&e.fields.length)h+='<div class="ef">'+e.fields.map(f=>'<div class="fl'+(f.inline?' in':'')+'"><div class="fn">'+esc(f.name)+'</div><div class="fv">'+md(f.value,g,mentions)+'</div></div>').join('')+'</div>';
  if(e.image&&isUrl(e.image.url))h+='<img class="eimg" src="'+esc(e.image.url)+'" loading="lazy" data-zoom="1">';
  else if(e.type==='video'&&e.thumbnail&&isUrl(e.thumbnail.url))h+='<img class="eimg" src="'+esc(e.thumbnail.url)+'" loading="lazy">';
  if(e.footer||e.timestamp)h+='<div class="eft">'+(e.footer&&isUrl(e.footer.icon_url)?'<img src="'+esc(e.footer.icon_url)+'">':'')+esc((e.footer?e.footer.text:'')+(e.footer&&e.timestamp?' • ':'')+(e.timestamp?new Date(e.timestamp).toLocaleString():''))+'</div>';
  h+='</div>';
  if(e.thumbnail&&e.type==='rich'&&isUrl(e.thumbnail.url))h+='<img class="eth" src="'+esc(e.thumbnail.url)+'" loading="lazy" data-zoom="1">';
  return h+'</div></div>'}

function attHtml(a){
  const ct=a.content_type||'';
  if(ct.startsWith('image/')&&isUrl(a.url))return'<img class="att" src="'+esc(a.url)+'" loading="lazy" data-zoom="1" alt="'+esc(a.filename)+'">';
  if(ct.startsWith('video/')&&isUrl(a.url))return'<video class="att" controls preload="metadata" src="'+esc(a.url)+'"></video>';
  if(ct.startsWith('audio/')&&isUrl(a.url))return'<audio controls preload="none" src="'+esc(a.url)+'"></audio>';
  return'<a class="file" target="_blank" rel="noopener noreferrer" href="'+esc(a.url)+'">'+ico('clip')+'<span><b>'+esc(a.filename)+'</b><small>'+fmtSize(a.size||0)+'</small></span></a>'}

const SYS={1:'added someone to the group',4:'changed the group name',6:'pinned a message to this channel.',7:'joined the server.',8:'boosted the server.',18:'created a thread.',19:'replied'};
function msgHtml(m,prev,g){
  const sysText=m.type&&m.type!==0&&m.type!==19&&m.type!==20?(SYS[m.type]||'sent a system message'):'';
  const mem=m.member?{...m.member,user:m.author}:memberOf(g,m.author.id);
  const name=dispName(g,m.author,mem);
  const col=g?colorOf(g,mem):'';
  const grp=prev&&!sysText&&prev.author.id===m.author.id&&!m.referenced_message&&!prev.type&&m.timestamp&&prev.timestamp&&(new Date(m.timestamp)-new Date(prev.timestamp))<420000&&sameDay(m.timestamp,prev.timestamp)?true:false;
  const mine=(m.mentions||[]).some(u=>u.id===ST.me.id)||m.mention_everyone;
  let h='<div class="m'+(grp?' g':'')+(mine?' hl':'')+(sysText?' sys':'')+'" data-id="'+m.id+'">';
  if(sysText){
    return h+'<div class="sa">'+ico('plus')+'</div><div class="sb"><b>'+esc(name)+'</b> '+esc(sysText)+' <time>'+esc(fmtTime(m.timestamp))+'</time></div></div>'}
  if(m.referenced_message){
    const r=m.referenced_message;
    const rm=memberOf(g,r.author.id);
    h+='<div class="rp" data-ref="'+r.id+'"><span class="rl"></span><img src="'+avatar(r.author,32)+'"><b style="'+(g&&colorOf(g,rm)?'color:'+colorOf(g,rm):'')+'">'+esc(dispName(g,r.author,rm))+'</b><span class="rt">'+esc((r.content||(r.attachments&&r.attachments.length?'Click to see attachment':'')).replace(/\n/g,' ').slice(0,100))+'</span></div>'}
  else if(m.type===19&&!m.referenced_message)h+='<div class="rp"><span class="rl"></span><i>Original message was deleted</i></div>';
  h+=grp?'<div class="gt"><time>'+new Date(m.timestamp).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</time></div>':'<img class="av" src="'+avatar(m.author)+'" loading="lazy" data-u="'+m.author.id+'">';
  h+='<div class="mc">';
  if(!grp)h+='<div class="mh"><span class="mn" data-u="'+m.author.id+'" style="'+(col?'color:'+col:'')+'">'+esc(name)+'</span>'+(m.author.bot?'<span class="tag">'+(m.author.system?'SYSTEM':'APP')+'</span>':'')+'<time>'+esc(fmtTime(m.timestamp))+'</time></div>';
  if(m.content)h+='<div class="mx">'+md(m.content,g,m.mentions)+(m.edited_timestamp?'<span class="ed2">(edited)</span>':'')+'</div>';
  (m.attachments||[]).forEach(a=>{h+=attHtml(a)});
  (m.embeds||[]).forEach(e=>{h+=embedHtml(e,g,m.mentions)});
  if(m.reactions&&m.reactions.length)h+='<div class="rxs">'+m.reactions.map(r=>'<button class="rx'+(r.me?' me':'')+'" data-e="'+esc(emojiKey(r.emoji))+'">'+(r.emoji.id?'<img class="ce" src="'+emojiUrl(r.emoji.id,r.emoji.animated)+'">':'<span>'+esc(r.emoji.name)+'</span>')+'<em>'+r.count+'</em></button>').join('')+'</div>';
  h+='</div><button class="mo" data-more="1" aria-label="More">'+ico('more')+'</button></div>';
  return h}

function toast(t,ms=3200){

function closeOv(){$$('.ov').forEach(o=>o.remove())}
function sheet(title,items,head){
  closeOv();
  const o=document.createElement('div');o.className='ov sheetov';
  o.innerHTML='<div class="sheet"><div class="grab"></div>'+(head||'')+(title?'<div class="sht">'+esc(title)+'</div>':'')+items.map((it,i)=>it.row?it.row:it.rx?'':'<button class="si'+(it.danger?' dn':'')+'" data-i="'+i+'">'+(it.icon?ico(it.icon):'')+'<span>'+esc(it.label)+'</span></button>').join('')+'</div>';
  o.addEventListener('click',e=>{
    if(e.target===o){o.remove();return}
    const b=e.target.closest('.si');
    if(b){const it=items[+b.dataset.i];o.remove();if(it&&it.fn)it.fn()}
    const x=e.target.closest('[data-r]');
    if(x){const it=items.find(i=>i.rx===x.dataset.r);o.remove();if(it)it.fn()}});
  document.body.appendChild(o);return o}
function modal(title,fields,okLabel,danger){
  closeOv();
  return new Promise(res=>{
    const o=document.createElement('div');o.className='ov modalov';
    o.innerHTML='<div class="modal"><h3>'+esc(title)+'</h3>'+fields.map(f=>{
      if(f.note)return'<p class="note">'+esc(f.note)+'</p>';
      if(f.type==='select')return'<label>'+esc(f.label)+'</label><select id="f_'+f.id+'">'+f.opts.map(([v,l])=>'<option value="'+esc(v)+'"'+(String(v)===String(f.val)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
      if(f.type==='area')return'<label>'+esc(f.label)+'</label><textarea id="f_'+f.id+'" placeholder="'+esc(f.ph||'')+'">'+esc(f.val||'')+'</textarea>';
      return'<label>'+esc(f.label)+'</label><input id="f_'+f.id+'" type="'+(f.type||'text')+'" placeholder="'+esc(f.ph||'')+'" value="'+esc(f.val||'')+'" autocomplete="off">'}).join('')
      +'<div class="mb"><button class="bt ghost" id="m_c">Cancel</button><button class="bt'+(danger?' red':'')+'" id="m_o">'+esc(okLabel||'Done')+'</button></div></div>';
    document.body.appendChild(o);
    const done=v=>{o.remove();res(v)};
    $('#m_c').onclick=()=>done(null);
    o.addEventListener('click',e=>{if(e.target===o)done(null)});
    $('#m_o').onclick=()=>{const v={};fields.forEach(f=>{if(f.id)v[f.id]=$('#f_'+f.id).value.trim()});done(v)};
    const first=o.querySelector('input,textarea');if(first)first.focus()})}
function confirmBox(title,note,ok,danger){return modal(title,[{note}],ok,danger).then(v=>!!v)}

function listHtml(l,g){
  let h='',prev=null;
  l.forEach(m=>{
    if(!prev||!sameDay(prev.timestamp,m.timestamp)){h+='<div class="dv"><span>'+esc(fmtDay(m.timestamp))+'</span></div>';prev=null}
    h+=msgHtml(m,prev,g);prev=m});
  return h}
function renderMsgs(keep){
  const el=$('#msgs'),l=ST.msgs.get(ST.c)||[],g=curGuild();
  const top=el.scrollTop,hgt=el.scrollHeight;
  if(!l.length){el.innerHTML='<div class="ph">'+ico('hash')+'<h2>No messages yet</h2><p>Be the first to say something.</p></div>';return}
  el.innerHTML='<div class="start">'+(l.length>=50?'':'<h2>'+esc((curChan()||{}).name?'Welcome to #'+curChan().name:'Start of conversation')+'</h2>')+'</div>'+listHtml(l,g);
  if(keep)el.scrollTop=top+(el.scrollHeight-hgt);
  else el.scrollTop=el.scrollHeight}
const nearBottom=()=>{const e=$('#msgs');return e.scrollHeight-e.scrollTop-e.clientHeight<160};
function appendMsg(m){
  const el=$('#msgs'),l=ST.msgs.get(ST.c),g=curGuild();
  if(!l)return;
  if(el.querySelector('.ph')){renderMsgs();return}
  const stick=nearBottom()||m.author.id===ST.me.id;
  const i=l.findIndex(x=>x.id===m.id);
  const prev=i>0?l[i-1]:null;
  let h='';
  if(!prev||!sameDay(prev.timestamp,m.timestamp))h+='<div class="dv"><span>'+esc(fmtDay(m.timestamp))+'</span></div>';
  h+=msgHtml(m,h?null:prev,g);
  el.insertAdjacentHTML('beforeend',h);
  if(stick)el.scrollTop=el.scrollHeight}
function redrawMsg(id){
  const el=document.querySelector('.m[data-id="'+id+'"]');
  const l=ST.msgs.get(ST.c)||[];
  const i=l.findIndex(x=>x.id===id);
  if(!el||i<0)return;
  const t=document.createElement('div');
  t.innerHTML=msgHtml(l[i],i>0&&sameDay(l[i-1].timestamp,l[i].timestamp)?l[i-1]:null,curGuild());
  el.replaceWith(t.firstChild)}
function dropMsg(id){renderMsgs(true)}

function drawTyping(){
  const m=ST.typing.get(ST.c),now=Date.now();
  let names=[];
  if(m){m.forEach((v,k)=>{if(v.t<now)m.delete(k);else names.push(v.name)})}
  const el=$('#typing');
  if(!names.length){el.innerHTML='';return}
  el.innerHTML='<span class="dots"><i></i><i></i><i></i></span><b>'+esc(names.slice(0,3).join(', '))+'</b> '+(names.length>1?'are':'is')+' typing…'}

function renderMembers(){
  const g=curGuild(),el=$('#mem');
  if(!g){el.innerHTML='';return}
  const mems=[...g.members.values()];
  const known=ST.pres.size>0&&!ST.limited;
  const on=m=>{const s=ST.pres.get(m.user.id);return s&&s!=='offline'&&s!=='invisible'};
  const groups=new Map();
  const add=(k,t,pos,m)=>{if(!groups.has(k))groups.set(k,{t,pos,l:[]});groups.get(k).l.push(m)};
  mems.forEach(m=>{
    if(known&&!on(m)){add('off','Offline',-2,m);return}
    const hr=roleList(g,m).find(r=>r.hoist);
    if(hr)add(hr.id,hr.name,hr.position,m);
    else add(known?'on':'all',known?'Online':'Members',-1,m)});
  let h='';
  [...groups.values()].sort((a,b)=>b.pos-a.pos).forEach(gr=>{
    gr.l.sort((a,b)=>dispName(g,a.user,a).localeCompare(dispName(g,b.user,b)));
    h+='<div class="mg">'+esc(gr.t)+' — '+gr.l.length+'</div>';
    gr.l.forEach(m=>{
      const s=ST.pres.get(m.user.id)||'offline';
      const c=colorOf(g,m);
      h+='<button class="mr'+(s==='offline'&&known?' off':'')+'" data-u="'+m.user.id+'"><span class="ua"><img src="'+avatar(m.user,48)+'" loading="lazy">'+(known?'<i style="background:'+stCol(s)+'"></i>':'')+'</span><span class="nm" style="'+(c?'color:'+c:'')+'">'+esc(dispName(g,m.user,m))+'</span>'+(m.user.bot?'<span class="tag">APP</span>':'')+'</button>'});
  });
  if(!mems.length)h='<p class="empty">'+(g.memErr?esc(g.memErr)+'. Enable the Server Members intent in the developer portal.':'Loading members…')+'</p>';
  el.innerHTML='<div class="mgh">Members</div>'+h}

function cancelEd(){ED.reply=null;ED.edit=null;pendingFiles=[];$('#in').value='';autoGrow();drawBars()}
function drawBars(){
  const b=$('#rbar');

  else if(ED.reply){b.hidden=false;b.innerHTML='<span>Replying to <b>'+esc(ED.reply.name)+'</b></span><button class="ib" id="rx">'+ico('x')+'</button>'}
  else b.hidden=true;

function autoGrow(){const e=$('#in');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,160)+'px'}

async function sendMsg(){
  const c=curChan();if(!c||!canSend())return;
  const inp=$('#in'),text=inp.value.trim();
  if(ED.edit){
    if(!text){toast('A message cannot be empty. Use delete instead.');return}
    const id=ED.edit;
    try{const m=await api('PATCH','/channels/'+c.id+'/messages/'+id,{content:text});const l=ST.msgs.get(c.id)||[];const o=l.find(x=>x.id===id);if(o){Object.assign(o,m);redrawMsg(id)}cancelEd()}catch(e){toast('Edit failed: '+e.message)}
    return}
  if(!text&&!pendingFiles.length)return;
  const body={content:text,allowed_mentions:{parse:['users','roles','everyone'],replied_user:true}};
  if(ED.reply)body.message_reference={message_id:ED.reply.id,channel_id:c.id,fail_if_not_exists:false};
  let payload=body;
  if(pendingFiles.length){
    const fd=new FormData();
    fd.append('payload_json',JSON.stringify({...body,attachments:pendingFiles.map((f,i)=>({id:i,filename:f.name}))}));
    pendingFiles.forEach((f,i)=>fd.append('files['+i+']',f,f.name));
    payload=fd}
  const keepText=text,keepFiles=pendingFiles,keepRep=ED.reply;
  inp.value='';ED.reply=null;pendingFiles=[];autoGrow();drawBars();
  try{
    const m=await api('POST','/channels/'+c.id+'/messages',payload);
    const l=ST.msgs.get(c.id);
    if(l&&!l.some(x=>x.id===m.id)){l.push(m);if(ST.c===c.id)appendMsg(m)}}
  catch(e){
    inp.value=keepText;pendingFiles=keepFiles;ED.reply=keepRep;autoGrow();drawBars();
    toast(e.status===403?'Missing permissions to send here.':e.status?'Send failed: '+e.message:'Could not reach Discord. Run the test in Settings, then Connection.')}}

  if(g&&has(p,P.MANAGE_MSG))items.push({label:m.pinned?'Unpin Message':'Pin Message',icon:'pin',fn:async()=>{try{await api(m.pinned?'DELETE':'PUT','/channels/'+c.id+'/pins/'+m.id);m.pinned=!m.pinned;toast(m.pinned?'Message pinned':'Message unpinned')}catch(e){toast(e.message)}}});

  if(g&&!mine&&mem){
    if(canMod(g,mem,P.MOD))items.push({label:'Timeout '+dispName(g,m.author,mem),icon:'x',danger:true,fn:()=>timeoutUser(g,mem)});

    if(canMod(g,mem,P.BAN))items.push({label:'Ban '+dispName(g,m.author,mem),icon:'x',danger:true,fn:()=>banUser(g,mem)})}
  sheet('',items)}

async function timeoutUser(g,m){
  const cur=m.communication_disabled_until&&new Date(m.communication_disabled_until)>new Date();
  const v=await modal('Timeout '+uname(m.user),[{id:'d',label:'Duration',type:'select',val:cur?'0':'600',opts:[...(cur?[['0','Remove timeout']]:[]),['60','60 seconds'],['300','5 minutes'],['600','10 minutes'],['3600','1 hour'],['86400','1 day'],['604800','1 week']]},{id:'r',label:'Reason (optional)',ph:'Shown in the audit log'}],'Apply',true);
  if(!v)return;
  const s=+v.d;
  try{
    const r=await api('PATCH','/guilds/'+g.id+'/members/'+m.user.id,{communication_disabled_until:s?new Date(Date.now()+s*1000).toISOString():null},{reason:v.r});
    if(r)g.members.set(m.user.id,{...m,...r});
    toast(s?'User timed out':'Timeout removed')}catch(e){toast('Failed: '+e.message)}}
async function kickUser(g,m){
  const v=await modal('Kick '+uname(m.user),[{note:'They can rejoin with a new invite.'},{id:'r',label:'Reason (optional)',ph:'Shown in the audit log'}],'Kick',true);
  if(!v)return;
  try{await api('DELETE','/guilds/'+g.id+'/members/'+m.user.id,undefined,{reason:v.r});g.members.delete(m.user.id);renderMembers();toast('Member kicked')}catch(e){toast('Failed: '+e.message)}}
async function banUser(g,m){
  const v=await modal('Ban '+uname(m.user),[{id:'x',label:'Delete message history',type:'select',val:'0',opts:[['0','Do not delete any'],['3600','Previous hour'],['86400','Previous 24 hours'],['604800','Previous 7 days']]},{id:'r',label:'Reason (optional)',ph:'Shown in the audit log'}],'Ban',true);
  if(!v)return;
  try{await api('PUT','/guilds/'+g.id+'/bans/'+m.user.id,{delete_message_seconds:+v.x},{reason:v.r});g.members.delete(m.user.id);renderMembers();toast('Member banned')}catch(e){toast('Failed: '+e.message)}}

  +'</div></div>';
  document.body.appendChild(o);
  $('#sx').onclick=()=>o.remove();
  $('#s_sp').onclick=async()=>{
    const b={},nm=$('#s_un').value.trim(),f=$('#s_av').files[0];
    if(nm&&nm!==u.username)b.username=nm;
    if(f){if(f.size>8e6){toast('Image too large.');return}b.avatar=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
    if(!Object.keys(b).length){toast('Nothing to change.');return}
    try{ST.me=await api('PATCH','/users/@me',b);saveAcc();renderUserBar();toast('Profile updated');o.remove()}catch(e){toast('Failed: '+e.message)}};
  $('#s_ss').onclick=()=>{ST.status={s:$('#s_st').value,t:+$('#s_at').value,x:$('#s_ax').value.trim()};LSset('bc_status',ST.status);sendPresence();renderUserBar();toast('Status updated')};
  $('#s_th').onchange=e=>{ST.set.theme=e.target.value;LSset('bc_set',ST.set);applyTheme()};
  $('#s_fs').onchange=e=>{ST.set.font=+e.target.value;LSset('bc_set',ST.set);applyTheme()};
  $('#s_iv').onclick=()=>{const l='https://discord.com/oauth2/authorize?client_id='+u.id+'&scope=bot%20applications.commands&permissions=8';navigator.clipboard&&navigator.clipboard.writeText(l).then(()=>toast('Invite link copied'),()=>toast(l))};
  $('#s_sa').onclick=()=>{const v=$('#s_api').value.trim();if(v&&!isUrl(v)){toast('Enter a full https address.');return}ST.set.api=v;LSset('bc_set',ST.set);toast(v?'Using your address':'Using Discord directly')};
  $('#s_ct').onclick=connTest;
  $('#s_ad').onclick=()=>{o.remove();logout(true)};
  $('#s_lo').onclick=()=>{o.remove();logout(false)};
  o.addEventListener('click',e=>{
    const s=e.target.closest('[data-sw]');
    if(s){const a=accs.find(x=>x.id===s.dataset.sw);if(a){o.remove();logout(false,true);start(a.token)}}
    const r=e.target.closest('[data-rm]');
    if(r){const id=r.dataset.rm;LSset('bc_acc',LS('bc_acc',[]).filter(x=>x.id!==id));if(id===u.id){o.remove();logout(false)}else{o.remove();settings()}}})}

async function connTest(){
  const res=$('#s_res');res.innerHTML='Testing…';
  const out=[];
  const t=async(label,fn)=>{try{const r=await fn();out.push('OK  '+label+(r?' ('+r+')':''))}catch(e){out.push('FAIL  '+label+': '+(e.status?'HTTP '+e.status+' '+e.message:'blocked before reaching Discord'))}};
  await t('Reach Discord',async()=>{const r=await fetch(apiBase()+'/gateway');return 'HTTP '+r.status});
  await t('Bot login',()=>api('GET','/users/@me').then(u=>u.username));
  const g=[...ST.chans.values()].find(c=>textual(c)&&c.guild_id);
  if(g)await t('Read #'+g.name,()=>api('GET','/channels/'+g.id+'/messages?limit=1').then(()=>''));
  res.innerHTML=out.map(esc).join('<br>');
}

function stopAll(){
  GW.stop=true;clearInterval(GW.hb);
  if(GW.ws){try{GW.ws.onclose=null;GW.ws.close()}catch(e){}}
  GW.ws=null;GW.sid=null;GW.seq=null;
  ['guilds','chans','msgs','dms','pres','unread','ment','typing'].forEach(k=>ST[k].clear());
  ST.me=null;ST.c=null;ST.g=null;ST.home=true;ST.ready=false;ST.limited=false}
function logout(add,silent){
  stopAll();
  if(!silent){LSset('bc_active','');}
  $('#app').hidden=true;
  showLogin(add?'':'')}
function authFail(m){stopAll();showLogin(m||'That token was rejected. Check it and try again.')}

function showLogin(err){
  const accs=LS('bc_acc',[]);
  $('#login').hidden=false;$('#app').hidden=true;
  $('#lerr').textContent=err||'';
  $('#laccs').innerHTML=accs.length?'<div class="lsub">Saved bots</div>'+accs.map(a=>'<button class="lacc" data-t="'+a.id+'"><img src="'+esc(a.av)+'"><span>'+esc(a.name)+'</span></button>').join(''):''}

async function start(tok){
  ST.tok=tok;GW.stop=false;GW.intents=FULL;GW.tries=0;
  try{
    const me=await api('GET','/users/@me');
    if(!me.bot){throw new Error('That is a user token. BotCord only works with bot tokens.')}
    ST.me=me}
  catch(e){ST.tok='';showLogin(e.status===401?'That token was rejected. Check it and try again.':e.message);return}
  saveAcc();
  $('#login').hidden=true;$('#app').hidden=false;
  renderUserBar();
  connect()}
function onReady(){
  saveAcc();
  if(!ST.home&&ST.g&&guildOf(ST.g)){renderAll();return}
  goHome();loadDMs();
  if(mq.matches)setTimeout(()=>{
    if(!ST.home)return;
    const lg=LS('bc_lastg','');
    const ok=g=>g&&!g.unavailable;
    const t=ok(ST.guilds.get(lg))?lg:([...ST.guilds.values()].find(ok)||{}).id;
    if(t)openGuild(t)},700)}

const MORE=new Map();
function msgIdFrom(t){const m=t.closest('.m');return m?m.dataset.id:null}
function findMsg(id){return(ST.msgs.get(ST.c)||[]).find(x=>x.id===id)}

$('#rail').addEventListener('click',e=>{
  const b=e.target.closest('.rb');if(!b)return;
  if(b.dataset.h){goHome();return}
  LSset('bc_lastg',b.dataset.g);openGuild(b.dataset.g);
  if(!mq.matches)$('#app').classList.add('lo')});
$('#chl').addEventListener('click',e=>{
  const cat=e.target.closest('[data-cat]');
  if(cat){const id=cat.dataset.cat;if(closed.has(id))closed.delete(id);else closed.add(id);LSset('bc_closed',[...closed]);renderChannels();return}
  const c=e.target.closest('[data-c]');
  if(c){openChannel(c.dataset.c);return}
  if(e.target.closest('#dmgo'))openDM($('#dmid').value.trim())});
$('#chl').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dmid')openDM(e.target.value.trim())});
$('#sh').addEventListener('click',e=>{if(e.target.closest('#gm'))guildMenu()});
$('#hd').addEventListener('click',e=>{
  if(e.target.closest('#lbtn')){$('#app').classList.toggle('lo');return}
  if(e.target.closest('#mbtn')){
    const g=curGuild();if(g&&!g.loadedMem)loadMembers(g);
    if(mq.matches)$('#app').classList.toggle('nom');else $('#app').classList.toggle('mo')}});
$('#scrim').addEventListener('click',closeDrawers);
$('#mem').addEventListener('click',e=>{const b=e.target.closest('[data-u]');if(b)profile(b.dataset.u)});
$('#ub').addEventListener('click',e=>{if(e.target.closest('#setb'))settings()});

let lp=null,lpMoved=false;
$('#msgs').addEventListener('click',e=>{
  const t=e.target;
  const rx=t.closest('.rx');
  if(rx){const id=msgIdFrom(rx),m=findMsg(id);if(m){const r=(m.reactions||[]).find(x=>emojiKey(x.emoji)===rx.dataset.e);toggleReact(m,rx.dataset.e,r&&r.me)}return}
  const z=t.closest('[data-zoom]');
  if(z){closeOv();const o=document.createElement('div');o.className='ov lb';o.innerHTML='<img src="'+esc(z.src)+'">';o.onclick=()=>o.remove();document.body.appendChild(o);return}
  const sp=t.closest('.sp');
  if(sp){sp.classList.toggle('show');return}
  const rp=t.closest('.rp[data-ref]');
  if(rp){const el=document.querySelector('.m[data-id="'+rp.dataset.ref+'"]');if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}return}
  const u=t.closest('[data-u]');
  if(u){profile(u.dataset.u);return}
  if(t.closest('[data-more]')){const id=msgIdFrom(t);if(id)msgMenu(id)}});
$('#msgs').addEventListener('contextmenu',e=>{const id=msgIdFrom(e.target);if(id){e.preventDefault();msgMenu(id)}});
$('#msgs').addEventListener('touchstart',e=>{
  const id=msgIdFrom(e.target);lpMoved=false;
  if(!id||e.target.closest('a,button,video,audio'))return;
  lp=setTimeout(()=>{if(!lpMoved)msgMenu(id)},520)},{passive:true});
$('#msgs').addEventListener('touchmove',()=>{lpMoved=true;clearTimeout(lp)},{passive:true});
$('#msgs').addEventListener('touchend',()=>clearTimeout(lp));
$('#msgs').addEventListener('scroll',async()=>{
  const el=$('#msgs'),c=ST.c;
  if(el.scrollTop>80||loadingOld||!c||MORE.get(c)===false)return;
  const l=ST.msgs.get(c);if(!l||!l.length)return;
  loadingOld=true;
  try{
    const older=await loadHistory(c,l[0].id);
    if(older.length<50)MORE.set(c,false);
    const have=new Set(l.map(x=>x.id)),fresh=older.filter(x=>!have.has(x.id));
    if(!fresh.length)MORE.set(c,false);
    if(fresh.length&&ST.c===c){ST.msgs.set(c,[...fresh,...l]);renderMsgs(true)}}
  catch(e){}
  loadingOld=false});

const inp=$('#in');
inp.addEventListener('input',()=>{
  autoGrow();
  const c=curChan();
  if(c&&inp.value&&Date.now()-typedAt>8000&&canSend()){typedAt=Date.now();api('POST','/channels/'+c.id+'/typing').catch(()=>{})}
  mentionAc()});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendMsg()}
  if(e.key==='Escape'&&(ED.edit||ED.reply))cancelEd()});
$('#snd').onclick=sendMsg;
$('#att').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  [...e.target.files].forEach(f=>{if(f.size>25*1024*1024)toast(f.name+' is larger than 25 MB.');else if(pendingFiles.length<10)pendingFiles.push(f)});
  e.target.value='';drawBars()};
$('#emo').onclick=()=>emojiPicker(e=>{
  const t=e.id?'<'+(e.animated?'a':'')+':'+e.name+':'+e.id+'>':e.name;
  const s=inp.selectionStart||inp.value.length;
  inp.value=inp.value.slice(0,s)+t+inp.value.slice(inp.selectionEnd||s);
  inp.focus();inp.setSelectionRange(s+t.length,s+t.length);autoGrow()});
$('#comp').addEventListener('click',e=>{
  if(e.target.closest('#rx')){cancelEd();return}
  const p=e.target.closest('[data-pf]');
  if(p){pendingFiles.splice(+p.dataset.pf,1);drawBars()}
  const a=e.target.closest('[data-m]');
  if(a){
    const s=inp.selectionStart,before=inp.value.slice(0,s).replace(/@[\w.]*$/,'<@'+a.dataset.m+'> ');
    inp.value=before+inp.value.slice(s);inp.focus();inp.setSelectionRange(before.length,before.length);$('#ac').innerHTML='';autoGrow()}});
inp.addEventListener('paste',e=>{
  const fs=[...(e.clipboardData&&e.clipboardData.files||[])];
  if(fs.length){fs.forEach(f=>{if(pendingFiles.length<10)pendingFiles.push(f)});drawBars();e.preventDefault()}});
function mentionAc(){
  const g=curGuild(),ac=$('#ac');
  const s=inp.selectionStart,m=inp.value.slice(0,s).match(/(^|\s)@([\w.]{1,32})$/);
  if(!g||!m){ac.innerHTML='';return}
  const q=m[2].toLowerCase();
  const l=[...g.members.values()].filter(x=>dispName(g,x.user,x).toLowerCase().includes(q)||x.user.username.toLowerCase().includes(q)).slice(0,6);
  ac.innerHTML=l.map(x=>'<button data-m="'+x.user.id+'"><img src="'+avatar(x.user,32)+'">'+esc(dispName(g,x.user,x))+'<small>'+esc(x.user.username)+'</small></button>').join('')}

$('#lgo').onclick=()=>{const t=$('#ltok').value.trim().replace(/^Bot\s+/i,'');if(!t){$('#lerr').textContent='Paste your bot token first.';return}$('#lerr').textContent='';$('#lgo').disabled=true;start(t).finally(()=>{$('#lgo').disabled=false;$('#ltok').value=''})};
$('#ltok').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lgo').click()});
$('#laccs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const a=LS('bc_acc',[]).find(x=>x.id===b.dataset.t);if(a)start(a.token)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});

let tx=0,ty=0,tt=0;
$('#chat').addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now()},{passive:true});
$('#chat').addEventListener('touchend',e=>{
  if(mq.matches)return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<90||Math.abs(dy)>50||Date.now()-tt>600)return;
  if(e.target.closest('pre,.em,video,audio'))return;
  const a=$('#app');
  if(dx>0){if(a.classList.contains('mo'))a.classList.remove('mo');else a.classList.add('lo')}
  else{if(a.classList.contains('lo'))a.classList.remove('lo');else if(curGuild()){const g=curGuild();if(!g.loadedMem)loadMembers(g);a.classList.add('mo')}}},{passive:true});

applyTheme();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function(){
  const id=LS('bc_active','');
  const a=LS('bc_acc',[]).find(x=>x.id===id);
  if(a)start(a.token);else showLogin('')})();
$('#att').innerHTML=ico('clip');$('#emo').innerHTML=ico('smile');$('#snd').innerHTML=ico('send');

</script>
</body>
</html>
